name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml

permissions:
  contents: read
  pages: write
  administration: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages with GitHub Actions build type
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.getPages({ owner, repo });
              core.info('GitHub Pages is already enabled');
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createPagesSite({
                owner,
                repo,
                build_type: 'workflow',
              });
              core.info('Enabled GitHub Pages (workflow build type)');
            }
